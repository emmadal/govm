name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # e.g. v1.0.2, either pushed directly or created by the release step below

permissions:
  contents: write

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      # Only the repository owner (or an admin) may publish a release.
      - name: Verify Owner/Admin Access
        run: |
          if [[ "${{ github.event.repository.owner.login }}" != "${{ github.actor }}" ]]; then
            RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission")
            PERMISSION=$(echo "$RESPONSE" | jq -r '.permission')
            echo "User ${{ github.actor }} has $PERMISSION permissions."
            if [[ "$PERMISSION" != "admin" ]]; then
              echo "Error: Only repository owners or admins can trigger releases!"
              exit 1
            fi
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      # On main: release only when the VERSION file points to a version that
      # has no release yet, so merging without a version bump is a no-op.
      # On a tag push: always release that tag.
      - name: Check whether a release is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
            EXISTS=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
            echo "VERSION tag: ${TAG}, existing releases with that tag: ${EXISTS}"
            if [[ "${EXISTS}" != "0" ]]; then
              echo "Release ${TAG} already exists, nothing to do."
              echo "needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Release ${TAG} will be built."
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        if: steps.check.outputs.needed == 'true'
        run: |
          mkdir -p build

          PLATFORMS=("linux/amd64" "linux/arm64" "linux/386" "darwin/amd64" "darwin/arm64" "windows/amd64" "windows/arm64" "windows/386")

          for PLATFORM in "${PLATFORMS[@]}"; do
            OS="${PLATFORM%/*}"
            ARCH="${PLATFORM#*/}"
            echo "Building for ${OS}/${ARCH}..."

            if [ "$OS" = "windows" ]; then
              OUTPUT="build/govm_${OS}_${ARCH}.exe"
            else
              OUTPUT="build/govm_${OS}_${ARCH}"
            fi

            GOOS=$OS GOARCH=$ARCH go build -ldflags="-s -w" -o "$OUTPUT" . || exit 1
          done

      - name: Create release and upload binaries
        if: steps.check.outputs.needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: Release ${{ steps.check.outputs.tag }}
          files: |
            build/govm_linux_amd64
            build/govm_linux_arm64
            build/govm_linux_386
            build/govm_darwin_amd64
            build/govm_darwin_arm64
            build/govm_windows_amd64.exe
            build/govm_windows_arm64.exe
            build/govm_windows_386.exe
